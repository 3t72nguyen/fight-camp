<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fight Camp">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b0c10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1284x2778.png">
<style>
html{color-scheme:dark;background:#0b0c10;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<title>Fight Camp Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
/* Layout: sticky scrolling ticker, day tabs, one big ringed WORK/REST/STOP button, transport row, three drum wheels, session checklist.
   Palette comes from the plan's own week colours on a gym-poster black. Dark by design. */
:root{
  color-scheme: dark;
  --bg:#0b0c10; --panel:#14161c; --panel-2:#1c1f27; --line:#2a2e38; --fg:#f3f4f6; --mute:#9ba1ad;
  --go:#2fbf71; --acc:#6f94e0;
  --f-display:'Helvetica Neue','HelveticaNeue-Light','Helvetica Neue Light','Inter',Helvetica,Arial,sans-serif;
  --f-body:'Helvetica Neue','HelveticaNeue-Light','Helvetica Neue Light','Inter',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,p{margin:0}
.app{max-width:460px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- 3D buttons ---------- */
.b3d{--face:#4a505c;--edge:#1a1d24;--ink:#fff;appearance:none;-webkit-appearance:none;border:0;margin:0;cursor:pointer;position:relative;touch-action:manipulation;
  color:var(--ink);font:500 19px/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;border-radius:14px;
  background-color:var(--face);
  background-image:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 46%,rgba(0,0,0,.18));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.2),0 6px 0 var(--edge),0 12px 16px rgba(0,0,0,.5);
  transition:transform .07s ease,box-shadow .07s ease,opacity .15s}
.b3d:active:not(:disabled){transform:translateY(5px);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.2),0 1px 0 var(--edge),0 3px 6px rgba(0,0,0,.5)}
.b3d:focus-visible{outline:3px solid #fff;outline-offset:3px}
.b3d:disabled{opacity:.4;cursor:not-allowed;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 3px 0 var(--edge)}
.b3d svg{width:1.1em;height:1.1em;flex:none}
.v-steel{--face:#4a505c;--edge:#1a1d24}
.v-amber{--face:#f0a92b;--edge:#8a5a06;--ink:#231500}
.v-light{--face:#e3e6ec;--edge:#868c98;--ink:#12141a}
.small{white-space:nowrap;height:44px;padding:0 14px;font-size:17px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px}

/* ---------- ticker ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 10px}
.ticker{position:relative;height:46px;border-radius:12px;background:#050608;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.06)}
.ticker::before,.ticker::after{content:"";position:absolute;top:0;bottom:0;width:22px;z-index:2;pointer-events:none}
.ticker::before{left:0;background:linear-gradient(90deg,#050608,transparent)}
.ticker::after{right:0;background:linear-gradient(270deg,#050608,transparent)}
.track{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;white-space:nowrap;will-change:transform}
.seg{display:inline-flex;align-items:center;gap:10px;padding-right:46px;font:400 21px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.tg{font-style:normal;font-weight:600;font-size:13px;letter-spacing:.16em;padding:5px 8px 4px;border-radius:6px;background:var(--acc);color:#0b0c10}
.tg.n{background:#e3e6ec}
.sp{font-style:normal;color:var(--mute)}

/* ---------- header, days ---------- */
.hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;margin-bottom:14px}
.hd h1{white-space:nowrap;font:300 28px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.hd p{color:var(--mute);font-size:13px;margin-top:3px}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:12px}
.day{height:60px;display:grid;place-items:center;align-content:center;gap:2px;padding:0;border-radius:12px}
.day small{font:500 11px/1 var(--f-display);letter-spacing:.18em;opacity:.8}
.day b{font:300 32px/1 var(--f-display)}
.day:not([aria-pressed="true"]) b{color:var(--dc)}
.day[aria-pressed="true"]{--face:var(--dc);--edge:var(--de);--ink:var(--di)}
.day[aria-pressed="true"]:disabled{opacity:1}
.dayinfo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dayinfo h2{font:300 30px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--acc)}
.dayinfo p{color:var(--mute);font-size:13px}

/* ---------- stage ---------- */
.stage{--ringc:#2fbf71;position:relative;width:min(80vw,300px);aspect-ratio:1;margin:16px auto 28px}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);transition:opacity .2s}
.ring circle{fill:none;stroke-width:2.6;stroke-linecap:round}
.ring .trk{stroke:#23262e}
.ring .prg{stroke:var(--ringc);stroke-dasharray:0 100;transition:stroke-dasharray .12s linear}
.big{position:absolute;inset:7.5%;width:85%;height:85%;border-radius:50%;display:grid;place-items:center;align-content:center;gap:2px;padding:0;
  box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -7px 0 rgba(0,0,0,.22),0 10px 0 var(--edge),0 22px 30px rgba(0,0,0,.6)}
.big:active:not(:disabled){transform:translateY(8px);box-shadow:inset 0 4px 0 rgba(255,255,255,.35),inset 0 -7px 0 rgba(0,0,0,.22),0 2px 0 var(--edge),0 5px 10px rgba(0,0,0,.55)}
.big::before{content:"";position:absolute;inset:9%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 50% 28%,rgba(0,0,0,.26),rgba(0,0,0,.06) 62%,rgba(255,255,255,.08));
  box-shadow:inset 0 4px 10px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.22)}
.big>*{position:relative;z-index:1}
.lbl{font:400 26px/1 var(--f-display);letter-spacing:.18em;padding-left:.2em}
.num{display:grid;place-items:center;font:300 clamp(72px,24vw,108px)/.95 var(--f-display);font-variant-numeric:tabular-nums;min-height:.95em}
.num svg{width:.6em;height:.6em}
.sub{font:500 13px/1.25 var(--f-body);letter-spacing:.08em;text-transform:uppercase;max-width:62%;text-align:center;opacity:.9;overflow-wrap:anywhere}
.stage[data-phase="idle"]{--ringc:#2fbf71}
.stage[data-phase="idle"] .big{--face:#2fbf71;--edge:#0f5c33;--ink:#06210f}
.stage[data-phase="ready"]{--ringc:#f0a92b}
.stage[data-phase="ready"] .big{--face:#f0a92b;--edge:#8a5a06;--ink:#231500}
.stage[data-phase="work"]{--ringc:#e8483a}
.stage[data-phase="work"] .big{--face:#e8483a;--edge:#7c1710;--ink:#fff}
.stage[data-phase="rest"]{--ringc:#2f86ef}
.stage[data-phase="rest"] .big{--face:#2f86ef;--edge:#123f7d;--ink:#fff}
.stage[data-phase="done"]{--ringc:#e9b934}
.stage[data-phase="done"] .big{--face:#e9b934;--edge:#8c6a0a;--ink:#231a00}
.stage[data-armed="1"]{--ringc:#ff5a4d}
.stage[data-armed="1"] .big{--face:#23252c;--edge:#0a0b0e;--ink:#ff5a4d}
.stage[data-armed="1"] .lbl{animation:blink .5s steps(2,jump-none) infinite}
.stage[data-paused="1"] .big{filter:saturate(.3) brightness(.85)}
.stage[data-paused="1"] .ring{opacity:.45}
@keyframes blink{50%{opacity:.25}}

/* ---------- transport ---------- */
.transport{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:26px}
.transport .b3d{height:60px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;letter-spacing:.05em}
@media (max-width:400px){.transport .b3d{font-size:16px;letter-spacing:.03em;gap:5px;padding:0 4px}}

/* ---------- settings ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 10px 14px;margin-bottom:26px}
.wheels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wheels .wheel{--it:36px}
.wheels .wi{font-size:26px;font-weight:400}
.wheels .wi.txt{font-size:15px;letter-spacing:.04em}
.wheels .wcap{font-size:11px;letter-spacing:.05em;white-space:nowrap;margin-bottom:6px}
.wheels .wband{left:3px;right:3px;border-radius:8px}
@media (max-width:380px){.wheels{gap:6px}.wheels .wcap{font-size:10px;letter-spacing:.02em}}
.wcap{font:500 13px/1 var(--f-display);letter-spacing:.14em;color:var(--mute);text-align:center;margin-bottom:8px;text-transform:uppercase}
.wheel{--it:44px;position:relative;height:calc(var(--it)*3);border-radius:14px;background:linear-gradient(180deg,#050609,#0e1015 50%,#050609);overflow:hidden;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.08)}
.wscroll{height:100%;overflow-y:auto;padding-block:var(--it);scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;outline-offset:-3px;touch-action:pan-y}
.wscroll::-webkit-scrollbar{display:none}
.wi{height:var(--it);display:grid;place-items:center;scroll-snap-align:center;font:300 32px/1 var(--f-display);color:var(--fg);cursor:pointer}
.wi.txt{font-size:22px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.wi.sel{color:var(--acc)}
.wband{position:absolute;left:6px;right:6px;top:var(--it);height:var(--it);border-top:2px solid var(--acc);border-bottom:2px solid var(--acc);border-radius:10px;pointer-events:none;background:rgba(255,255,255,.05);z-index:1}
.wheel::before,.wheel::after{content:"";position:absolute;left:0;right:0;height:calc(var(--it)*.86);z-index:2;pointer-events:none}
.wheel::before{top:0;background:linear-gradient(#050609,transparent)}
.wheel::after{bottom:0;background:linear-gradient(transparent,#050609)}
.hint{margin-top:14px;color:var(--mute);font-size:13px}

/* ---------- session list ---------- */
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:8px}
.shead h3{margin:0;font:300 28px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.sinfo{text-align:right;color:var(--mute);font:500 14px/1.1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.pips{display:flex;gap:5px;justify-content:flex-end;margin-top:6px}
.pip{width:18px;height:6px;border-radius:3px;background:#2a2e38}
.pip.on{background:var(--go)}
.pip.cur{background:var(--acc)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto 24px;align-items:center;gap:10px;min-height:54px;padding:6px 8px;border-bottom:1px solid var(--line)}
.row .ix{font:300 24px/1 var(--f-display);color:var(--mute);text-align:center}
.row .nm{font-weight:400;font-size:16px;min-width:0;overflow-wrap:anywhere}
.row .ck{width:24px;height:24px;color:var(--go);opacity:0}
.row.done .nm{text-decoration:line-through;text-decoration-thickness:2px;color:var(--mute)}
.row.done .ck{opacity:1}
.row.cur{background:var(--panel-2);border-radius:12px;border-bottom-color:transparent}
.row.cur .ix{color:var(--acc)}
.pill{display:inline-block;margin-left:8px;padding:3px 7px 2px;border-radius:6px;background:var(--acc);color:#0b0c10;font:600 11px/1 var(--f-display);letter-spacing:.12em;vertical-align:2px}


.v-go{--face:#2fbf71;--edge:#0f5c33;--ink:#06210f}
.small[hidden],.sheet[hidden]{display:none}
.shead{gap:10px}
.shead .small{height:36px;font-size:14px;padding:0 10px;margin-bottom:3px;flex:none}
.edit{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);
  font:500 15px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap;touch-action:manipulation;box-shadow:0 2px 0 #07080b}
.edit svg{width:15px;height:15px;color:var(--acc);flex:none}
.edit.ed{border-color:var(--acc);color:var(--acc)}
.edit:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.edit:disabled{opacity:.5;cursor:default}
.edit:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.64);overscroll-behavior:contain;touch-action:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-card{width:100%;max-width:460px;margin-bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 16px 16px;box-shadow:0 -10px 40px rgba(0,0,0,.6);outline:none}
.sheet-card h3{margin:2px 0 6px;font:300 28px/1.05 var(--f-display);letter-spacing:.05em;text-transform:uppercase;text-align:center;text-wrap:balance}
.sheet-card .wcap{margin-bottom:10px}
.sheet-card .wheel{max-width:240px;margin:0 auto}
.sh-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
.sh-actions .b3d{height:50px;padding:0 6px;font-size:17px}
@media (prefers-reduced-motion:reduce){
  .stage[data-armed="1"] .lbl{animation:none}
  .b3d,.ring .prg{transition:none}
}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div class="ticker" id="ticker" aria-label="Current and next exercise"><div class="track" id="track"></div></div>
  </div>

  <header class="hd">
    <div>
      <h1>Fight Camp</h1>
      <p>5-day boxing circuit</p>
    </div>
    <button class="b3d small v-steel" id="voice" type="button" aria-pressed="true"><span id="vico"></span><span id="vtxt">Sound on</span></button>
  </header>

  <nav class="days" id="days" aria-label="Workout day"></nav>
  <div class="dayinfo"><h2 id="dname">Jab &amp; Burn</h2></div>

  <section class="stage" id="stage" data-phase="idle" data-armed="0" data-paused="0">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="trk" cx="50" cy="50" r="47" pathLength="100"></circle>
      <circle class="prg" id="prg" cx="50" cy="50" r="47" pathLength="100"></circle>
    </svg>
    <button class="b3d big" id="main" type="button" aria-label="Start, work, rest or stop">
      <span class="lbl" id="lbl">START</span>
      <span class="num" id="num"></span>
      <span class="sub" id="sub"></span>
    </button>
  </section>

  <div class="transport">
    <button class="b3d v-steel" id="back" type="button" disabled><span id="icoBack"></span>Back</button>
    <button class="b3d v-amber" id="pause" type="button" disabled><span id="icoPause"></span><span id="ptxt">Pause</span></button>
    <button class="b3d v-steel" id="skip" type="button" disabled>Skip<span id="icoSkip"></span></button>
  </div>

  <section class="panel" aria-label="Timer settings">
    <div class="wheels">
      <div><div class="wcap">Sets</div><div class="wheel" id="wSets"></div></div>
      <div><div class="wcap">Rest (s)</div><div class="wheel" id="wRest"></div></div>
      <div><div class="wcap">Plank (s)</div><div class="wheel" id="wPlank"></div></div>
      <div><div class="wcap">Pace (s)</div><div class="wheel" id="wPace"></div></div>
    </div>
    <p class="hint">Rep pace is the time for one rep. Plank sec overrides the plank holds unless you edited that exercise. Tap the pencil beside an exercise to set its own reps or seconds.</p>
  </section>

  <section aria-label="Session exercises">
    <div class="shead">
      <h3>Session</h3>
      <button class="b3d small v-steel" id="resetEdits" type="button" hidden>Reset edits</button>
      <div><div class="sinfo" id="sinfo"></div><div class="pips" id="pips"></div></div>
    </div>
    <ol class="list" id="list"></ol>
  </section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="shTitle" tabindex="-1">
    <h3 id="shTitle">Exercise</h3>
    <div class="wcap" id="shCap">Reps</div>
    <div class="wheel" id="wEdit"></div>
    <div class="sh-actions">
      <button class="b3d small v-steel" id="shReset" type="button">Plan</button>
      <button class="b3d small v-steel" id="shCancel" type="button">Cancel</button>
      <button class="b3d small v-go" id="shSave" type="button">Save</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};

/* ---------- plan: built from the weekly poster ---------- */
function R(n,v,pace,say){return {k:'r',n:n,v:v,v0:v,ed:false,pace:pace,say:say||n.replace(/[-]/g,' ')}}
function T(n,v,say,plank){return {k:'t',n:n,v:v,v0:v,ed:false,say:say||n.replace(/[-]/g,' '),plank:!!plank}}
var DAYS=[
 {id:1,name:'Jab & Burn',src:'Week 1 · Monday',c:'#6f94e0',e:'#34508f',i:'#0b1020',items:[
  R("Fighter's jumping jacks",40,0.75),
  R("Straight 1-2 combos",30,1,"Straight one two combos"),
  R("Burpees",25,2.4),
  R("Squats",25,1.6),
  R("Mountain climbers",40,0.65),
  T("Slip-and-return drill",40)]},
 {id:2,name:'Legs & Push',src:'Week 1 · Tuesday',c:'#98bd4f',e:'#546f1f',i:'#0f1a03',items:[
  R("Wide-grip push-ups",20,1.8,"Wide grip push ups"),
  R("Low squats",20,1.8),
  R("Pivot-step lunges, left leg",16,1.7,"Pivot step lunges, left leg"),
  R("Pivot-step lunges, right leg",16,1.7,"Pivot step lunges, right leg"),
  R("Squats",25,1.6),
  R("Jump squats",23,1.4),
  T("Boxer's march in place",60)]},
 {id:3,name:'Core Crunch',src:'Week 1 · Wednesday',c:'#e8924f',e:'#9a5420',i:'#1f0e02',items:[
  R("Hollow-body crunches",40,1.3,"Hollow body crunches"),
  R("Decline push-ups",20,2,"Decline push ups"),
  R("Low crunches",20,1.2),
  T("Side plank, left side",20,"Side plank, left side",true),
  T("Side plank, right side",20,"Side plank, right side",true),
  R("Fast step-ups",20,0.9,"Fast step ups"),
  R("Burpees",20,2.4)]},
 {id:4,name:'Combo Power',src:'Weeks 3–4 · Monday',c:'#b9bdc6',e:'#6a6f7a',i:'#12141a',items:[
  R("Fighter's jumping jacks",30,0.75),
  R("Push-ups",25,1.7,"Push ups"),
  R("Hook 3-2-5 combos",25,1.1,"Hook three two five combos"),
  R("Squats",25,1.6),
  R("Mountain climbers",30,0.65),
  R("Uppercut 2-5-6 combos",25,1.1,"Uppercut two five six combos"),
  T("Roll-under drill",30),
  T("Jab sprint",10)]},
 {id:5,name:'Fight Night',src:'Weeks 2–5 · Finisher',c:'#e5574a',e:'#8d2118',i:'#fff',items:[
  R("Fighter's jumping jacks",30,0.75),
  R("Fast 1-2-3 combos",30,1,"Fast one two three combos"),
  R("Six-punch combos",25,1.8),
  R("Rear hooks (No. 4)",20,1.1,"Rear hooks, number four"),
  R("Southpaw pivot-step lunges, left leg",18,1.7,"Southpaw pivot step lunges, left leg"),
  R("Southpaw pivot-step lunges, right leg",18,1.7,"Southpaw pivot step lunges, right leg"),
  T("Plank shoulder-tap run",50,"Plank shoulder tap run",true),
  T("Jab-cross sprint",30,"Jab cross sprint"),
  R("Final-bell burpees",37,2.4)]}
];

/* ---------- settings ---------- */
var cfg={day:0,sets:3,rest:30,plank:0,pace:1.5,voice:true,edits:{}};
try{
  var sv=JSON.parse(localStorage.getItem('fightcamp.v1')||'{}');

function save(){try{localStorage.setItem('fightcamp.v1',JSON.stringify({day:cfg.day,sets:cfg.sets,rest:cfg.rest,plank:cfg.plank,paceSec:cfg.pace,voice:cfg.voice,edits:cfg.edits}))}catch(e){}}

/* ---------- icons ---------- */

/* ---------- coach voice: one queue, never cut off ---------- */
var HAS=('speechSynthesis' in window)&&(typeof SpeechSynthesisUtterance!=='undefined');
var voice=null;
var BAD=/albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|kathy|ralph|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley/i;
function pickVoice(){
  if(!HAS)return;
  try{
    var vs=window.speechSynthesis.getVoices(),best=null,bs=-1;
    vs.forEach(function(v){
      if(!/^en/i.test(v.lang)||BAD.test(v.name))return;
      var sc=/^en[-_]AU/i.test(v.lang)?40:/^en[-_]GB/i.test(v.lang)?28:/^en[-_]US/i.test(v.lang)?24:10;
      if(/premium|enhanced|natural|neural/i.test(v.name+' '+(v.voiceURI||'')))sc+=30;
      if(v.localService)sc+=2;
      if(sc>bs){bs=sc;best=v}
    });
    voice=best;
  }catch(e){}
}
if(HAS){pickVoice();try{window.speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}

var Sp={q:[],busy:false,wd:0,hold:0,end:0,gen:0};
function speaking(){return Sp.busy||Sp.q.length>0||(performance.now()-Sp.end)<180}
function sayQ(text,o){
  o=o||{};
  if(!cfg.voice||!HAS){if(o.cb)setTimeout(o.cb,0);return}
  if(o.skip&&(Sp.busy||Sp.q.length))return;
  Sp.q.push({t:text,rate:o.rate||0.95,pitch:o.pitch||1,cb:o.cb});
  pump();
}
function pump(){
  if(Sp.busy||!Sp.q.length)return;
  var now=performance.now();
  if(now<Sp.hold){setTimeout(pump,Sp.hold-now+5);return}
  var j=Sp.q.shift(),gen=Sp.gen,fin=false,u;
  Sp.busy=true;
  function done(){
    if(fin||gen!==Sp.gen)return;
    fin=true;clearTimeout(Sp.wd);
    Sp.busy=false;Sp.end=performance.now();
    if(j.cb){try{j.cb()}catch(e){}}
    setTimeout(pump,40);
  }
  try{
    u=new SpeechSynthesisUtterance(j.t);
    if(voice){u.voice=voice;u.lang=voice.lang}else{u.lang='en-AU'}
    u.rate=j.rate;u.pitch=j.pitch;u.volume=1;
    u.onend=done;u.onerror=done;
    Sp.wd=setTimeout(done,1200+j.t.length*95/j.rate);
    window.speechSynthesis.speak(u);
  }catch(e){done()}
}
function hush(){
  Sp.gen++;Sp.q=[];Sp.busy=false;clearTimeout(Sp.wd);Sp.hold=performance.now()+140;
  try{if(HAS)window.speechSynthesis.cancel()}catch(e){}
}
function cnt(skip){return {skip:!!skip,rate:0.9+Math.random()*0.06,pitch:0.94+Math.random()*0.08}}

/* ---------- rest-clock tick (silent while the coach speaks) ---------- */
var AC=null,tickN=0;
function audioCtx(){
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
    if(AC&&AC.state==='suspended')AC.resume();
  }catch(e){}
  return AC;
}
function unlockAudio(){
  var ac=audioCtx();
  if(ac){try{var b=ac.createBuffer(1,1,22050),sr=ac.createBufferSource();sr.buffer=b;sr.connect(ac.destination);sr.start(0)}catch(e){}}
}
function tick(){
  if(!cfg.voice||speaking())return;
  var ac=audioCtx();if(!ac||ac.state!=='running')return;
  try{
    var t=ac.currentTime,hi=(tickN++%2===0),o=ac.createOscillator(),g=ac.createGain();
    o.type='triangle';o.frequency.setValueAtTime(hi?1250:900,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.28,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.08);
  }catch(e){}
}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(60)}catch(e){}}
var wl=null;
function wake(){try{if(navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}}catch(e){}}
function unwake(){try{if(wl)wl.release()}catch(e){}wl=null}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&running())wake()});

/* ---------- state ---------- */
var S={tok:0,phase:'idle',set:0,idx:0,done:[],paused:false,lead:0,acc:0,remain:0,ms:0,total:1,restTotal:0,nextIdx:0,newSet:false,last:-1,thr:3,armed:false,armT:0};
function items(){return DAYS[cfg.day].items}
function running(){return S.phase==='ready'||S.phase==='work'||S.phase==='rest'}
function durOf(it){return it.k==='t'?((it.plank&&cfg.plank&&!it.ed)?cfg.plank:it.v):it.v}
function lab(it){return it.k==='t'?it.n+' '+durOf(it)+'s':it.v+' '+it.n}
function tgt(it){return it.k==='t'?durOf(it)+' sec':it.v+' reps'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* Per-exercise edits are stored as {"dayIndex-exerciseIndex": value} and laid over the poster plan. */
function applyEdits(){
  DAYS.forEach(function(d,di){d.items.forEach(function(it,i){
    var v=cfg.edits[di+'-'+i];
    it.v=it.v0;it.ed=false;
    if(typeof v==='number'&&isFinite(v)){
      var ok=it.k==='t'?(v>=5&&v<=300&&v%5===0):(v>=1&&v<=100&&v%1===0);
      if(ok){it.v=v;it.ed=true}
    }
  })});
}
function defOf(it){return it.k==='t'?((it.plank&&cfg.plank)?cfg.plank:it.v0):it.v0}
applyEdits();

function begin(){
  S.set=0;S.done=items().map(function(){return false});S.paused=false;S.newSet=false;S.armed=false;
  S.phase='ready';S.ms=4000;S.last=5;
  unlockAudio();
  sayQ('Get ready.',{rate:0.95});wake();renderAll();
}
function startItem(i){
  var it=items()[i],tok=++S.tok;
  S.idx=i;S.phase='work';S.acc=0;
  if(it.k==='t'){S.total=durOf(it);S.ms=S.total*1000;S.last=S.total;S.remain=0}
  else{S.total=it.v;S.remain=it.v}
  S.lead=1e9; /* the clock holds until the coach has finished speaking */
  var phrase=it.say+'. '+(it.k==='t'?durOf(it)+' seconds.':it.v+' reps.');
  sayQ(phrase,{rate:0.96,cb:function(){if(S.tok===tok&&S.phase==='work')S.lead=cfg.voice?350:900}});
  renderAll();
}
function finishWork(){
  S.done[S.idx]=true;buzz();
  var L=items(),lastInSet=S.idx===L.length-1;
  if(lastInSet&&S.set+1>=cfg.sets){complete();return}
  S.nextIdx=lastInSet?0:S.idx+1;S.newSet=lastInSet;
  if(cfg.rest>0){
    S.phase='rest';S.restTotal=cfg.rest;S.ms=cfg.rest*1000;S.last=cfg.rest;S.thr=cfg.rest>=15?5:3;
    sayQ(lastInSet?'Set complete. Rest.':'Rest.',{rate:0.95});
    renderAll();
  }else{advance()}
}
function advance(){
  if(S.newSet){S.set++;S.done=items().map(function(){return false});S.newSet=false}
  startItem(S.nextIdx);
}
function complete(){
  S.phase='done';S.armed=false;S.paused=false;
  sayQ('Workout complete. Great work.',{rate:0.95});unwake();renderAll();
}
function stop(){
  hush();clearTimeout(S.armT);
  S.phase='idle';S.paused=false;S.armed=false;S.done=[];unwake();
  sayQ('Stopped.',{rate:0.95});renderAll();
}
function reset(){hush();S.phase='idle';S.done=[];S.set=0;S.idx=0;S.armed=false;S.paused=false;renderAll()}
function back(){
  if(S.phase!=='work'&&S.phase!=='rest')return;
  hush();
  var i=S.idx;
  if(S.phase==='work'){
    if(i>0){i--}
    else if(S.set>0){S.set--;i=items().length-1;S.done=items().map(function(_,k){return k<i})}
  }
  S.newSet=false;
  for(var k=i;k<S.done.length;k++)S.done[k]=false;
  S.paused=false;
  startItem(i);
}
function skip(){
  if(S.phase==='ready'){hush();startItem(0)}
  else if(S.phase==='work'){hush();finishWork()}
  else if(S.phase==='rest'){hush();advance()}
}
function togglePause(){
  if(!running())return;
  S.paused=!S.paused;
  if(S.paused)hush();
  else if(S.phase==='work'&&S.lead>1e8)S.lead=600;
  renderAll();
}
function onMain(){
  if(S.phase==='idle'){begin();return}
  if(S.phase==='done'){reset();return}
  if(!S.armed){
    S.armed=true;clearTimeout(S.armT);
    S.armT=setTimeout(function(){S.armed=false;renderStage()},3000);
    renderStage();
  }else{stop()}
}

/* PT-style rep call: spoken only when the pace leaves room for it, never rushed */
function repCall(n){
  var p=cfg.pace,st=p>=1?1:(p>=0.5?2:(p>=0.2?5:10)),text=null;
  if(n===1){if(p>=0.5)text='Last one.'}
  else if(n%st===0||(n<=3&&p>=0.7))text=n+'.';
  if(text)sayQ(text,cnt(true));
}
function step(dt){
  var it;
  if(S.phase==='ready'){
    S.ms-=dt;var s0=Math.ceil(S.ms/1000);
    if(s0!==S.last){S.last=s0;if(s0>0&&s0<=3)sayQ(s0+'.',cnt())}
    if(S.ms<=0)startItem(0);
    return;
  }
  if(S.phase==='rest'){
    S.ms-=dt;var s1=Math.ceil(S.ms/1000);
    if(s1!==S.last){
      S.last=s1;
      if(s1>0&&s1<=S.thr)sayQ(s1+'.',cnt());
      if(s1>0)tick();
    }
    if(S.ms<=0)advance();
    return;
  }
  if(S.lead>0){S.lead-=dt;return}
  it=items()[S.idx];
  if(it.k==='t'){
    S.ms-=dt;var s2=Math.max(0,Math.ceil(S.ms/1000));
    if(s2!==S.last){S.last=s2;if(s2>0&&(s2<=5||s2%10===0))sayQ(s2+'.',cnt())}
    if(S.ms<=0)finishWork();
  }else{
    var p=cfg.pace*1000;S.acc+=dt;
    while(S.acc>=p&&S.remain>0){S.acc-=p;S.remain--;if(S.remain>0)repCall(S.remain)}
    if(S.remain<=0)finishWork();
  }
}
var prev=performance.now();
setInterval(function(){
  var now=performance.now(),dt=Math.min(now-prev,1000);prev=now;
  if(running()&&!S.paused)step(dt);
  renderStage();
},50);

/* ---------- rendering ---------- */
var cache={};
function put(id,val,html){
  if(cache[id]===val)return;cache[id]=val;
  var el=$('#'+id);if(html)el.innerHTML=val;else el.textContent=val;
}
function renderStage(){
  var L=items(),it=L[S.idx]||L[0],ph=S.phase,lbl='START',num='',sub='',prog=0,html=false;
  if(ph==='idle'){lbl='START';num=ICON.play;html=true;sub=DAYS[cfg.day].name+' · '+L.length+' exercises'}
  else if(ph==='ready'){lbl='READY';num=String(Math.min(3,Math.max(1,Math.ceil(S.ms/1000))));sub='Get set';prog=1-S.ms/4000}
  else if(ph==='work'){
    lbl='WORK';
    if(it.k==='t'){num=String(Math.max(0,Math.ceil(S.ms/1000)));prog=S.lead>0?0:1-S.ms/(S.total*1000);sub=it.n+' · seconds'}
    else{num=String(S.remain);prog=S.lead>0?0:(S.total-S.remain+S.acc/(cfg.pace*1000))/S.total;sub=it.n+' · reps left'}
  }
  else if(ph==='rest'){lbl='REST';num=String(Math.max(0,Math.ceil(S.ms/1000)));sub='Next: '+L[S.nextIdx].n;prog=1-S.ms/(S.restTotal*1000)}
  else{lbl='DONE';num=ICON.check;html=true;sub='Tap to reset';prog=1}
  if(S.armed&&running()){lbl='STOP';sub='Tap again to end'}
  else if(S.paused&&running()){sub='Paused'}
  put('lbl',lbl);put('num',num,html);put('sub',sub);
  var st=$('#stage');
  st.dataset.phase=ph;
  st.dataset.armed=(S.armed&&running())?'1':'0';
  st.dataset.paused=(S.paused&&running())?'1':'0';
  prog=Math.max(0,Math.min(1,prog));
  $('#prg').style.strokeDasharray=(prog*100).toFixed(2)+' 100';
}

var T={pos:0,w:0,seg:'',init:false},trackEl=$('#track');
function tg(t,n){return '<i class="tg'+(n?' n':'')+'">'+esc(t)+'</i>'}
function tx(t){return '<span>'+esc(t)+'</span>'}
var DOT='<i class="sp">•</i>';
function renderTicker(){
  var L=items(),d=DAYS[cfg.day],p=S.phase,parts=[];
  var setTxt=p==='idle'?cfg.sets+(cfg.sets===1?' set':' sets'):(p==='done'?'All sets done':'Set '+(S.set+1)+' of '+cfg.sets);
  if(p==='idle'||p==='ready'){
    parts.push(tg(p==='ready'?'Get ready':'Day '+d.id),tx(d.name),DOT,tg('Today',true));
    L.forEach(function(it){parts.push(tx(lab(it)),DOT)});
    parts.push(tx(setTxt));
  }else if(p==='work'){
    var nx=S.idx<L.length-1?lab(L[S.idx+1]):(S.set+1<cfg.sets?'Set '+(S.set+2)+' · '+lab(L[0]):'Finish');
    parts.push(tg('Now'),tx(lab(L[S.idx])),DOT,tg('Next',true),tx(nx));
    if(S.idx+2<L.length)parts.push(DOT,tg('Then',true),tx(lab(L[S.idx+2])));
    parts.push(DOT,tx(setTxt));
  }else if(p==='rest'){
    parts.push(tg('Rest'),tx(cfg.rest+' sec'),DOT,tg('Next',true),tx((S.newSet?'Set '+(S.set+2)+' · ':'')+lab(L[S.nextIdx])),DOT,tx(setTxt));
  }else{
    parts.push(tg('Done'),tx('Workout complete'),DOT,tx(cfg.sets+(cfg.sets===1?' set':' sets')+' finished'));
  }
  parts.push(DOT);
  var seg='<span class="seg">'+parts.join('')+'</span>';
  if(seg===T.seg)return;
  T.seg=seg;rebuildTape();
}
function rebuildTape(){
  var tw=$('#ticker').clientWidth||400;
  trackEl.innerHTML=T.seg;
  var f=trackEl.firstElementChild,w=f?f.getBoundingClientRect().width:0;
  if(!w)return;
  var k=Math.ceil(tw/w)+2,h='';
  for(var i=0;i<k;i++)h+=T.seg;
  trackEl.innerHTML=h;
  if(!T.init){T.pos=-tw;T.init=true}else if(T.w>0){T.pos=T.pos*w/T.w}
  T.w=w;
}
/* The tape moves right to left on its own clock, so it keeps running whatever the OS motion setting is. */
var tLast=performance.now();
function tapeFrame(now){
  var dt=Math.min(now-tLast,100);tLast=now;
  if(T.w){
    T.pos+=dt*0.075;
    while(T.pos>=T.w)T.pos-=T.w;
    trackEl.style.transform='translate3d('+(-T.pos).toFixed(1)+'px,0,0)';
  }else if(T.seg){rebuildTape()}
  requestAnimationFrame(tapeFrame);
}
requestAnimationFrame(tapeFrame);

function renderMeta(){
  var d=DAYS[cfg.day];
  document.documentElement.style.setProperty('--acc',d.c);
  put('dname',d.name);
}
function renderTabs(){
  var tabs=document.querySelectorAll('.day');
  for(var i=0;i<tabs.length;i++){
    tabs[i].setAttribute('aria-pressed',i===cfg.day?'true':'false');
    tabs[i].disabled=running();
  }
}
function renderList(){
  var L=items(),cur=-1,tag='';
  if(S.phase==='work'){cur=S.idx;tag='Now'}
  else if(S.phase==='rest'&&!S.newSet){cur=S.nextIdx;tag='Next'}
  else if(S.phase==='ready'){cur=0;tag='Next'}
  var n=0;
  var html=L.map(function(it,i){
    var dn=!!S.done[i]&&S.phase!=='idle';if(dn)n++;
    return '<li class="row'+(dn?' done':'')+(i===cur?' cur':'')+'"><span class="ix">'+(i+1)+'</span>'
      +'<span class="nm">'+esc(it.n)+(i===cur?'<span class="pill">'+tag+'</span>':'')+'</span>'
      +'<button class="edit'+(it.ed?' ed':'')+'" type="button" data-i="'+i+'"'+(running()?' disabled':'')+' aria-label="Edit '+esc(it.n)+', now '+tgt(it)+'"><span>'+tgt(it)+'</span>'+ICON.pen+'</button><span class="ck">'+ICON.check+'</span></li>';
  }).join('');
  put('list',html,true);
  $('#resetEdits').hidden=running()||!L.some(function(it){return it.ed});
  var setTxt=S.phase==='idle'?cfg.sets+(cfg.sets===1?' set':' sets'):(S.phase==='done'?'All '+cfg.sets+' sets done':'Set '+(S.set+1)+' of '+cfg.sets);
  put('sinfo',setTxt+' · '+n+'/'+L.length);
  var p='';
  for(var s=0;s<cfg.sets;s++){
    var on=S.phase==='done'||(S.phase!=='idle'&&s<S.set);
    var c=S.phase!=='idle'&&S.phase!=='done'&&s===S.set;
    p+='<span class="pip'+(on?' on':'')+(c?' cur':'')+'"></span>';
  }
  put('pips',p,true);
}
function renderTransport(){
  var r=running();
  $('#back').disabled=!(S.phase==='work'||S.phase==='rest');
  $('#skip').disabled=!r;
  $('#pause').disabled=!r;
  put('icoPause',S.paused?ICON.play:ICON.pause,true);
  put('ptxt',S.paused?'Resume':'Pause');
  $('#voice').setAttribute('aria-pressed',cfg.voice?'true':'false');
  put('vico',cfg.voice?ICON.vOn:ICON.vOff,true);
  put('vtxt',cfg.voice?'Sound on':'Sound off');
}
function renderAll(){renderMeta();renderTabs();renderTicker();renderList();renderTransport();renderStage()}

/* ---------- day tabs ---------- */
(function(){
  var h='';
  DAYS.forEach(function(d,i){
    h+='<button class="b3d day" type="button" data-i="'+i+'" aria-label="Day '+d.id+', '+esc(d.name)+'" style="--dc:'+d.c+';--de:'+d.e+';--di:'+d.i+'"><small>DAY</small><b>'+d.id+'</b></button>';
  });
  $('#days').innerHTML=h;
  $('#days').addEventListener('click',function(e){
    var b=e.target.closest('.day');if(!b||running())return;
    cfg.day=+b.getAttribute('data-i');save();
    S.phase='idle';S.done=[];S.set=0;S.idx=0;
    renderAll();
  });
})();

/* ---------- drum wheels ---------- */
function Wheel(root,labels,start,aria,onChange){
  var ITEM=44,N=labels.length,COPIES=7,MID=3,cur=start,raf=0,t=0;
  root.innerHTML='<div class="wscroll" tabindex="0" role="spinbutton" aria-label="'+aria+'"></div><div class="wband"></div>';
  var sc=root.firstChild,h='';
  ITEM=parseFloat(getComputedStyle(root).getPropertyValue('--it'))||44;
  for(var c=0;c<COPIES;c++){for(var i=0;i<N;i++){h+='<div class="wi'+(isNaN(+labels[i])?' txt':'')+'" data-a="'+(c*N+i)+'">'+labels[i]+'</div>'}}
  sc.innerHTML=h;
  var els=sc.children;
  var pLo=-1,pHi=-1;
  function paint(){
    var st=sc.scrollTop,c0=Math.round(st/ITEM),lo=Math.max(0,c0-3),hi=Math.min(els.length-1,c0+3),i;
    if(pLo>=0){for(i=pLo;i<=pHi;i++){if(i<lo||i>hi){els[i].style.transform='';els[i].style.opacity='';els[i].classList.remove('sel')}}}
    for(i=lo;i<=hi;i++){
      var o=(i*ITEM-st)/ITEM,a=Math.min(Math.abs(o),2.4);
      els[i].style.transform='perspective(280px) rotateX('+Math.max(-70,Math.min(70,-o*32)).toFixed(1)+'deg) scale('+(1-a*0.1).toFixed(3)+')';
      els[i].style.opacity=Math.max(0.15,1-a*0.38).toFixed(2);
      els[i].classList.toggle('sel',a<0.5);
    }
    pLo=lo;pHi=hi;
  }
  function aria(){
    sc.setAttribute('aria-valuemin','0');sc.setAttribute('aria-valuemax',String(N-1));
    sc.setAttribute('aria-valuenow',String(cur));sc.setAttribute('aria-valuetext',String(labels[cur]));
  }
  function goAbs(a,smooth){
    a=Math.max(0,Math.min(els.length-1,a));
    try{sc.scrollTo({top:a*ITEM,behavior:smooth?'smooth':'auto'})}catch(e){sc.scrollTop=a*ITEM}
  }
  function commit(){
    var abs=Math.round(sc.scrollTop/ITEM),m=((abs%N)+N)%N;
    if(abs<2*N||abs>=5*N){sc.scrollTop=(MID*N+m)*ITEM;paint()}
    if(m!==cur){cur=m;aria();onChange(m)}
  }
  sc.addEventListener('scroll',function(){
    if(!raf)raf=requestAnimationFrame(function(){raf=0;paint()});
    clearTimeout(t);t=setTimeout(commit,140);
  },{passive:true});
  sc.addEventListener('click',function(e){var w=e.target.closest('.wi');if(w)goAbs(+w.getAttribute('data-a'),true)});
  sc.addEventListener('keydown',function(e){
    var abs=Math.round(sc.scrollTop/ITEM);
    if(e.key==='ArrowUp'){e.preventDefault();goAbs(abs-1,true)}
    else if(e.key==='ArrowDown'){e.preventDefault();goAbs(abs+1,true)}
  });
  function init(){sc.scrollTop=(MID*N+cur)*ITEM;paint();aria()}
  init();
  requestAnimationFrame(init);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){init()})}
  return {value:function(){var a=Math.round(sc.scrollTop/ITEM);return ((a%N)+N)%N}};
}
var setsL=[],restL=[],plankL=['Plan'],i0;
for(i0=1;i0<=10;i0++)setsL.push(i0);
for(i0=0;i0<=60;i0+=5)restL.push(i0);
for(i0=10;i0<=300;i0+=5)plankL.push(i0);
Wheel($('#wSets'),setsL,cfg.sets-1,'Number of sets',function(i){cfg.sets=i+1;save();renderAll()});
Wheel($('#wRest'),restL,cfg.rest/5,'Rest seconds',function(i){cfg.rest=i*5;save();renderAll()});
Wheel($('#wPlank'),plankL,cfg.plank?cfg.plank/5-1:0,'Plank seconds',function(i){cfg.plank=i===0?0:5*(i+1);save();renderAll()});
var paceL=[];for(i0=1;i0<=50;i0++)paceL.push((i0/10).toFixed(1));
Wheel($('#wPace'),paceL,Math.max(0,Math.min(49,Math.round(cfg.pace*10)-1)),'Seconds per rep',function(i){cfg.pace=(i+1)/10;save();renderAll()});

/* ---------- wiring ---------- */
$('#main').addEventListener('click',onMain);
$('#back').addEventListener('click',back);
$('#skip').addEventListener('click',skip);
$('#pause').addEventListener('click',togglePause);
$('#voice').addEventListener('click',function(){
  cfg.voice=!cfg.voice;save();unlockAudio();
  if(!cfg.voice)hush();else sayQ('Sound on.',{rate:0.95});
  renderTransport();
});
/* ---------- per-exercise editor ---------- */
var ED={i:-1,timed:false,labels:[],get:null};
function openEdit(i){
  if(running())return;
  var it=items()[i];if(!it)return;
  var timed=it.k==='t',labels=[],v;
  if(timed){for(v=5;v<=300;v+=5)labels.push(v)}else{for(v=1;v<=100;v++)labels.push(v)}
  ED.i=i;ED.timed=timed;ED.labels=labels;
  $('#shTitle').textContent=it.n;
  $('#shCap').textContent=timed?'Seconds · 5 to 300':'Reps · 1 to 100';
  $('#shReset').textContent='Plan '+defOf(it)+(timed?'s':'');
  $('#sheet').hidden=false;
  var idx=timed?Math.round(it.v/5)-1:it.v-1;
  idx=Math.max(0,Math.min(labels.length-1,idx));
  var root=$('#wEdit');root.innerHTML='';
  ED.get=Wheel(root,labels,idx,timed?'Seconds':'Reps',function(){}).value;
  try{$('#sheet .sheet-card').focus()}catch(e){}
}
function closeEdit(){ED.i=-1;ED.get=null;$('#sheet').hidden=true}
function setEdit(i,val){
  var it=items()[i];if(!it)return;
  var key=cfg.day+'-'+i;
  if(val===defOf(it))delete cfg.edits[key];else cfg.edits[key]=val;
  applyEdits();save();renderAll();
}
$('#list').addEventListener('click',function(e){
  var b=e.target.closest('.edit');
  if(!b||b.disabled)return;
  openEdit(+b.getAttribute('data-i'));
});
$('#shSave').addEventListener('click',function(){
  if(ED.i<0||!ED.get)return;
  setEdit(ED.i,ED.labels[ED.get()]);closeEdit();
});
$('#shReset').addEventListener('click',function(){
  if(ED.i<0)return;
  var it=items()[ED.i];if(it)setEdit(ED.i,defOf(it));
  closeEdit();
});
$('#shCancel').addEventListener('click',closeEdit);
$('#sheet').addEventListener('click',function(e){if(e.target===$('#sheet'))closeEdit()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ED.i>=0)closeEdit()});
$('#resetEdits').addEventListener('click',function(){
  Object.keys(cfg.edits).forEach(function(k){if(k.indexOf(cfg.day+'-')===0)delete cfg.edits[k]});
  applyEdits();save();renderAll();
});
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){T.seg='';renderTicker()})}
renderAll();
})();
</script>
